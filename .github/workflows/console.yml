name: console

# Checks for the studio console (apps/control-panel) and the ledger cross-format tests.
# Needs no secrets, no database, no pipeline service and no GPU box: unit tests are pure,
# and the browser tests run the console on fixtures (ILY-205 Decision B) with the ledger
# in a temp dir. See docs/specs/2026-11-10-ilyrium-console-resolve-style.md, Phase 0.

on:
  push:
    branches: [main]
    paths:
      - "apps/control-panel/**"
      - "tests/test_ledger_cross_format.py"
      - "tests/fixtures/ledger/**"
      - "ilyrium-shots/provenance.py"
      - "ilyrium-shots/provenance_record.schema.json"
      - "ilyrium-shots/shot_spec.schema.json"
      - ".github/workflows/console.yml"
  pull_request:
    paths:
      - "apps/control-panel/**"
      - "tests/test_ledger_cross_format.py"
      - "tests/fixtures/ledger/**"
      - "ilyrium-shots/provenance.py"
      - "ilyrium-shots/provenance_record.schema.json"
      - "ilyrium-shots/shot_spec.schema.json"
      - ".github/workflows/console.yml"

permissions:
  contents: read

concurrency:
  # Superseded pushes to a PR cancel the older run; every push to main keeps its own run.
  group: console-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  console:
    name: install, typecheck, unit, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/control-panel
    env:
      # Belt and braces: the tests never need a database, so make sure none is reachable.
      DATABASE_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/control-panel/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/control-panel/pnpm-lock.yaml
      - name: Install (frozen lockfile; postinstall generates the Prisma clients)
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Unit tests (vitest)
        run: pnpm test
      - name: Build
        run: pnpm run build
      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests (Playwright, fixtures only)
        run: pnpm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/control-panel/playwright-report
          retention-days: 7

  ledger:
    name: ledger cross-format (python)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install "pytest>=8,<10" "jsonschema>=4.20,<5"
      # Only this file: the rest of tests/ imports backend modules that are not in git
      # yet (spec decision D1). Widen this once they land.
      - name: Ledger cross-format tests
        run: python -m pytest tests/test_ledger_cross_format.py -q
