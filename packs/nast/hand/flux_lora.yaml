---
job: extension
config:
  name: "nast_flux"
  process:
    - type: 'sd_trainer'
      training_folder: "/home/ec2-user/ai-toolkit/output"
      device: cuda:0
      trigger_word: "thomas_nast_style"
      network:
        type: "lora"
        linear: 16
        linear_alpha: 16
      save:
        dtype: float16
        save_every: 250
        max_step_saves_to_keep: 4
        push_to_hub: false
      datasets:
        - folder_path: "/home/ec2-user/slm-foundry/packs/nast/data/hand/train"
          caption_ext: "txt"
          caption_dropout_rate: 0.05
          shuffle_tokens: false
          cache_latents_to_disk: true
          resolution: [ 512, 768, 1024 ]   # 1024 restored on the 48GB L40S for max fidelity
      train:
        batch_size: 1
        steps: 1500
        gradient_accumulation_steps: 1
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: true
        noise_scheduler: "flowmatch"
        optimizer: "adamw8bit"
        lr: 1e-4
        ema_config:
          use_ema: true
          ema_decay: 0.99
        dtype: bf16
      model:
        name_or_path: "black-forest-labs/FLUX.1-schnell"
        assistant_lora_path: "ostris/FLUX.1-schnell-training-adapter"
        is_flux: true
        quantize: true   # 48GB L40S has ample headroom; quantize kept for speed (set false for a marginal max-quality bump)
      sample:
        sampler: "flowmatch"
        sample_every: 250
        width: 1024
        height: 1024
        prompts:
          - "[trigger] a powerful senator depicted as a giant octopus labeled MONOPOLY strangling city hall"
          - "[trigger] the Tammany tiger loose in a ruined Roman arena over a fallen woman labeled THE REPUBLIC"
          - "[trigger] Santa Claus in stars and stripes distributing gifts to Union soldiers in a winter camp"
          - "[trigger] a corrupt political boss with a money bag for a head, top hat, standing over a torn ledger"
        neg: ""
        seed: 42
        walk_seed: true
        guidance_scale: 1
        sample_steps: 4
meta:
  name: "[name]"
  version: '1.0'
