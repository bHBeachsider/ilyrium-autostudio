---
job: extension
config:
  name: "nast_sdxl"
  process:
    - type: 'sd_trainer'
      training_folder: "/home/ec2-user/ai-toolkit/output"
      device: cuda:0
      trigger_word: "thomas_nast_style"
      network:
        type: "lora"
        linear: 16
        linear_alpha: 16
      save:
        dtype: float16
        save_every: 300
        max_step_saves_to_keep: 4
      datasets:
        - folder_path: "/home/ec2-user/slm-foundry/packs/nast/data/hand/train"
          caption_ext: "txt"
          caption_dropout_rate: 0.05
          shuffle_tokens: false
          cache_latents_to_disk: true
          resolution: [ 768, 1024 ]
      train:
        batch_size: 1
        steps: 1800
        gradient_accumulation_steps: 1
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: true
        noise_scheduler: "ddpm"
        optimizer: "adamw8bit"
        lr: 1e-4
        dtype: bf16
      model:
        name_or_path: "stabilityai/stable-diffusion-xl-base-1.0"
        is_v2: false
        is_xl: true
      sample:
        sampler: "ddpm"
        sample_every: 300
        width: 1024
        height: 1024
        prompts:
          - "[trigger] a powerful senator depicted as a giant octopus labeled MONOPOLY strangling city hall"
          - "[trigger] the Tammany tiger loose in a ruined Roman arena over a fallen woman labeled THE REPUBLIC"
          - "[trigger] Santa Claus in stars and stripes distributing gifts to Union soldiers in a winter camp"
          - "[trigger] a corrupt political boss with a money bag for a head, top hat, standing over a torn ledger"
        neg: "color, photograph, modern, blurry"
        seed: 42
        walk_seed: true
        guidance_scale: 7
        sample_steps: 25
meta:
  name: "[name]"
  version: '1.0'
