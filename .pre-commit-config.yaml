# Ilyrium auto-studio pre-commit gates (ILY-203, RSI L0).
# Install once:  pip install pre-commit && pre-commit install
repos:
  - repo: local
    hooks:
      - id: lint-no-raw-sdk
        name: harness-only execution (no raw model SDK / direct ComfyUI API)
        entry: python harness/lint_no_raw_sdk.py
        language: system
        types: [python]

      - id: admission-gate
        name: eval-driven agent admission (manifest + 5 golden cases + rubric)
        entry: python harness/admission_gate.py
        language: system
        files: ^(agents/|evals/)
        pass_filenames: false
